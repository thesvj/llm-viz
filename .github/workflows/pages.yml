name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          node .yarn/releases/yarn-4.1.0.cjs install --immutable
          NEXT_PUBLIC_BASE_PATH=/llm-viz node .yarn/releases/yarn-4.1.0.cjs build
          touch out/.nojekyll
          # Pages serves a folder before a same-named .html file, so put each page inside its folder too.
          for f in out/*.html; do d="${f%.html}"; [ -d "$d" ] && cp "$f" "$d/index.html"; done; true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
